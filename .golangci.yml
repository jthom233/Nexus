linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - ineffassign
    - unused
    - gosimple

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true
      - name: unexported-return
        disabled: true

issues:
  exclude-dirs:
    - .claude
    - .codegiraffe
    - .serena
  max-issues-per-linter: 50
  max-same-issues: 5
